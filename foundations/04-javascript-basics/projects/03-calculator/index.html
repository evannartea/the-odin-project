<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
        
        <!-- Custom JS -->
        <script src="script.js" defer></script>
    </head>

    <body>
        <div class="frame-container">
            <!-- Screen -->
            <div class="screen-container">
                <div id="screen-display">
                    <div class="eye-container">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div id="smile"></div>
                </div>
            </div>

            <!-- Slot/Clear -->
            <div class="slot-container">
                <div id="disc-slot"></div>
                <button id="clear-btn" class="operator-key">C</button>
            </div>

            <!-- Keypad -->
            <div class="keypad-container">
                <!-- Number Keys -->
                <div class="numbers-container">
                    <button class="number-key">7</button>
                    <button class="number-key">8</button>
                    <button class="number-key">9</button>
                    <button class="number-key">4</button>
                    <button class="number-key">5</button>
                    <button class="number-key">6</button>
                    <button class="number-key">1</button>
                    <button class="number-key">2</button>
                    <button class="number-key">3</button>
                    <button class="number-key">0</button>
                    <button id="decimal-key" class="number-key">.</button>
                </div>

                <!-- Operator Keys -->
                <div class="operators-container">
                    <button id="add-btn" class="operator-key"><span>+</span></button>
                    <button id="subtract-btn" class="operator-key">-</button>
                    <div class="triangle-wrapper">
                        <button id="divide-btn" class="operator-key">÷</button>
                    </div>
                    <button id="multiply-btn" class="operator-key">x</button>
                    <button id="equals-btn" class="operator-key">=</button>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>
