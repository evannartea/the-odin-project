    <head>

        <title>Calculator</title>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
        
        <!-- Custom JS -->
        <script src="script.js" defer></script>

    <body>

            <div id="screen-container">
                
            </div>

                    <div class="number-key">5</div>

                <div id="operators-container">
                    test
                </div>
            </div>
        </div>
