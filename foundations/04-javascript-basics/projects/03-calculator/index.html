<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
        
        <!-- Custom JS -->
        <script src="script.js" defer></script>
    </head>

    <body>
        <div id="frame-container">
            <!-- Screen -->
            <div id="screen-container">
                
            </div>

            <!-- Slot -->
            <div id="slot-container">
                <div id="disc-slot"></div>
                <button id="clear-btn">CLEAR</button>
            </div>

            <!-- Keypad -->
            <div id="keypad-container">
                <!-- Number Keys -->
                <div id="numbers-container">
                    <button class="number-key">7</button>
                    <button class="number-key">8</button>
                    <button class="number-key">9</button>
                    <button class="number-key">4</button>
                    <button class="number-key">5</button>
                    <button class="number-key">6</button>
                    <button class="number-key">1</button>
                    <button class="number-key">2</button>
                    <button class="number-key">3</button>
                </div>

                <!-- Operator Keys -->
                <div id="operators-container">
                    <button id="divide-btn"></button>
                    <button id="multiply-btn"></button>
                    <button id="subtract-btn"></button>
                    <button id="add-btn"></button>
                    <button id="equals-btn"></button>
                </div>
            </div>
        </div>
    </body>

</html>
