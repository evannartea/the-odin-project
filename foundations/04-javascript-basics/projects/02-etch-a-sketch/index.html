<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Etch A Sketch</title>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
        
        <!-- Custom JS -->
        <script src="script.js" defer></script>
    </head>

    <body>
        <div id="frame-wrapper">
            <!-- Logo Header -->
            <div class="header-container">
                <div id="header-item-1">MAGIC</div>
                <div id="header-item-2">Etch A Sketch</div>
                <div id="header-item-3">SCREEN</div>
            </div>

            <!-- Screen -->
            <div id="screen-container">
                
            </div>

            <!-- Panel -->
            <div class="panel-container">
                <div class="dial"></div>
                <div class="slider-container">
                    <input id="range-slider" type="range" min="16" max="100" value="16">
                    <span id="range-value">16x16 GRID</span>
                </div>
                <div class="dial"></div>
            </div>
        </div>
    </body>

</html>
