<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up Form</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Logo Sidebar -->
        <aside id="sidebar">
            <div id="logo-container">
                <img src="assets/images/odin-lined.png" alt="odin-logo" height="150">
                <span>ODIN</span>
            </div>

            <div id="credits-container">
                <span>Photo by <a href="https://unsplash.com/@haliewestphoto">Haillie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></span>
            </div>
        </aside>

        <!-- Sign-up Form -->
        <main id="main-container">

            <!-- Hero Section -->
            <section id="hero-container" class="section">
                <div>
                    {quote text}
                </div>
            </section>
            
            <!-- Form Section -->
            <section id="form-container" class="section">
                <div>
                    {sign-up form}
                </div>
            </section>

            <!-- CTA Section -->
            <section id="button-container" class="section">
                <div>
                    {create account button}
                </div>
            </section>
            
        </main>
    </body>

</html>
