<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up Form</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Logo Sidebar -->
        <aside id="sidebar">
            <div id="logo-container">
                <img src="assets/images/odin-lined.png" alt="odin-logo" height="100">
                <span>ODIN</span>
            </div>

            <div id="credits-container">
                <span>Photo by <a href="https://unsplash.com/@samueljames16">Samuel James</a> on <a href="https://unsplash.com/photos/viking-warrior-stone-statue-in-garden-zYJbjVR_lSs">Unsplash</a></span>
            </div>
        </aside>

        <!-- Sign-up Form -->
        <main id="main-container">

            <!-- Hero Section -->
            <section id="hero-container" class="section">
                <p>
                    This is not a real online service! You know you need something<br>
                    like this in your life to help you realise your deepest dreams.<br>
                    Sign up <em>now</em> to get started.
                </p>
                <p>
                    You <em>know</em> you want to.
                </p>
            </section>
            
            <!-- Form Section -->
            <section id="form-container" class="section">
                <form action="" method="post">
                    <div>
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" name="first_name" placeholder="Thor" minlength="2" maxlength="50" required>
                    </div>

                    <div>
                        <label for="last_name">LAST NAME</label>
                        <input type="text" name="last_name" placeholder="Odinson" minlength="2" maxlength="50" required>
                    </div>

                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" placeholder="thor@asgardmail.com" required>
                    </div>

                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" name="phone" placeholder="07123 45678" pattern="^(?:(?:0|\+?44\s?|0044\s?)(?:\d\s?){9,10})$" required>
                    </div>

                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password"  name="password" required>
                    </div>

                    <div>
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm_password" required>
                    </div>
                </form>
            </section>

            <!-- CTA Section -->
            <section id="cta-container" class="section">
                <a href="index.html">
                    <button>Create Account</button>
                </a>
                <p>
                    Already have an account? <span>Log in</span>
                </p>
            </section>
            
        </main>
    </body>

</html>
